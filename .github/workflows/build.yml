name: build
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest,    target: x86_64-unknown-linux-musl,  asset: linux-x86_64}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: linux-aarch64}
          - {runner: macos-15-intel,   target: x86_64-apple-darwin,        asset: macos-x86_64}
          - {runner: macos-14,         target: aarch64-apple-darwin,       asset: macos-aarch64}
          - {runner: windows-latest,   target: x86_64-pc-windows-msvc,     asset: windows-x86_64.exe}
          - {runner: windows-11-arm,   target: aarch64-pc-windows-msvc,    asset: windows-aarch64.exe}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: anuveshasingh/blackbox-ml-game
          ref: rust
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *windows* ]]; then export RUSTFLAGS="-C target-feature=+crt-static"; fi
          cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        shell: bash
        run: |
          exe="target/${{ matrix.target }}/release/blackbox-ml-game"
          [[ "${{ matrix.target }}" == *windows* ]] && exe="$exe.exe"
          mkdir smoke && cd smoke && "../$exe" list && "../$exe" show puzzle_07 --plot
      - name: Stage
        shell: bash
        run: |
          exe="target/${{ matrix.target }}/release/blackbox-ml-game"
          [[ "${{ matrix.target }}" == *windows* ]] && exe="$exe.exe"
          mkdir out && cp "$exe" "out/blackbox-ml-game-${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*
  commit:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true
      - name: Commit binaries
        run: |
          chmod +x bin/* && ls -l bin
          git config user.name github-actions && git config user.email actions@github.com
          git add bin && git commit -m "Add built binaries" && git push
